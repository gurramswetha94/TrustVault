{% extends "base.html" %}

{% block title %}Sign In - TrustVault{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-shield">🛡️</div>
            <h2>Sign in to TrustVault</h2>
            <p>Zero Trust Document Security &amp; Access Control</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="auth-form">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" required autofocus placeholder="e.g. alice_owner">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Authenticate Securely</button>
        </form>

        <div class="evaluator-box">
            <div class="evaluator-header">
                <span class="evaluator-tag">Evaluator Quick-Fill</span>
                <span class="evaluator-note">Click any account to pre-fill credentials:</span>
            </div>
            <div class="seed-buttons">
                <button type="button" class="btn-seed" onclick="fillCreds('admin', 'Admin@TrustVault2026!')">
                    <span class="seed-role">ADMIN</span>
                    <span class="seed-user">admin</span>
                </button>
                <button type="button" class="btn-seed" onclick="fillCreds('alice_owner', 'Alice@TrustVault2026!')">
                    <span class="seed-role">OWNER</span>
                    <span class="seed-user">alice_owner</span>
                </button>
                <button type="button" class="btn-seed" onclick="fillCreds('carol_viewer', 'Carol@TrustVault2026!')">
                    <span class="seed-role">VIEWER</span>
                    <span class="seed-user">carol_viewer</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(username, password) {
    document.getElementById('identifier').value = username;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
